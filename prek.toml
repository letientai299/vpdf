default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  { id = "lint", name = "lint", entry = "mise run lint", language = "system", pass_filenames = false, always_run = true },
  { id = "test", name = "test", entry = "mise run test", language = "system", pass_filenames = false, always_run = true },
]
