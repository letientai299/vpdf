[package]
name = "vpdf"
version = "0.1.0"
edition.workspace = true
build = "scripts/build.rs"
rust-version.workspace = true
license = "MIT"
description = "A Vim-inspired terminal PDF reader powered by MuPDF and the Kitty graphics protocol."
repository = "https://github.com/letientai299/vpdf"

[lints]
workspace = true

[workspace]
members = [
  ".",
  "crates/vpdf-model",
  "crates/vpdf-search",
  "crates/vpdf-pdf",
  "crates/vpdf-protocol",
  "crates/vpdf-reader",
  "crates/terminal",
  "crates/ui",
  "crates/vpdf-gui",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Pixel and cell math casts on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The library is not published.
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Long fallback arms read better in `match`.
single_match_else = "allow"
# Nursery
cognitive_complexity = "deny"
derive_partial_eq_without_eq = "deny"
redundant_clone = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
# Restriction
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
todo = "deny"
unimplemented = "deny"

# Fat LTO tripled rebuilds for 1-3% speed.
[profile.release]
lto = "thin"
strip = true
debug = false

[profile.app]
inherits = "release"
codegen-units = 1

[workspace.dependencies]
vpdf-ui = { path = "crates/ui" }
vpdf-terminal = { path = "crates/terminal" }
vpdf-pdf = { path = "crates/vpdf-pdf" }
vpdf-search = { path = "crates/vpdf-search" }
vpdf-model = { path = "crates/vpdf-model" }
vpdf-protocol = { path = "crates/vpdf-protocol" }
vpdf-reader = { path = "crates/vpdf-reader" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fancy-regex = "0.16"
flate2 = "1"
mupdf = { version = "=0.8.0", default-features = false, features = [
  "base14-fonts",
] }
notify = "8.2.0"
rustix = { version = "1", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = [
  "system",
] }
icu_segmenter = { version = "2.3", default-features = false, features = [
  "compiled_data",
] }
unicode-script = "0.5"
smallvec = "1"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
unicode-width = "0.2"
tempfile = "3"
font-kit = "0.14"

[dependencies]
vpdf-ui.workspace = true
vpdf-terminal.workspace = true
vpdf-pdf.workspace = true
vpdf-search.workspace = true
vpdf-model.workspace = true
vpdf-reader.workspace = true
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
mupdf = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
sysinfo = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mupdf = { workspace = true, features = ["sys-lib-zlib"] }

[dev-dependencies]
flate2.workspace = true
sha2.workspace = true
tempfile = { workspace = true }

[[bench]]
name = "reader"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "stages"
harness = false

[[bench]]
name = "micro"
harness = false

[patch.crates-io]
mupdf = { git = "https://github.com/messense/mupdf-rs", rev = "ffaf28f5a96c478661e228dd04564afdcf2477c6" }
mupdf-sys = { git = "https://github.com/messense/mupdf-rs", rev = "ffaf28f5a96c478661e228dd04564afdcf2477c6" }

[[bench]]
name = "manuals"
harness = false
