[package]
name = "vpdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
description = "A keyboard-driven terminal PDF reader"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
redundant_clone = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
debug = true
strip = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fancy-regex = "0.16"
flate2 = "1"
mupdf = { version = "=0.8.0", default-features = false, features = [
  "base14-fonts",
  "bundled-fonts",
] }
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
unicode-width = "0.2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "reader"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "stages"
harness = false
