[package]
name = "vpdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "A keyboard-driven terminal PDF reader"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Pixel and cell math casts on purpose.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# The library is not published.
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Long fallback arms read better in `match`.
single_match_else = "allow"
# Nursery
cognitive_complexity = "deny"
derive_partial_eq_without_eq = "deny"
redundant_clone = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
# Restriction
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.bench]
debug = true
strip = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fancy-regex = "0.16"
flate2 = "1"
mupdf = { version = "=0.8.0", default-features = false, features = [
  "base14-fonts",
  "bundled-fonts",
] }
notify = "8.2.0"
rustix = { version = "1", features = ["event", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
unicode-width = "0.2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "reader"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "stages"
harness = false

[[bench]]
name = "micro"
harness = false

[patch.crates-io]
mupdf = { git = "https://github.com/messense/mupdf-rs", rev = "ffaf28f5a96c478661e228dd04564afdcf2477c6" }
mupdf-sys = { git = "https://github.com/messense/mupdf-rs", rev = "ffaf28f5a96c478661e228dd04564afdcf2477c6" }
