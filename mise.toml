[tools]
rust = "1.99.1"
prek = "0.5.5"
rumdl = "0.2.79"
taplo = "0.10.0"
upx = { version = "5.2.1", os = ["linux"] }

[tasks.build]
description = "Build the optimized reader"
run = "sh scripts/build.sh"

[tasks.release]
description = "Package the release executable with UPX on Linux"
depends = ["build"]
run = "sh scripts/release.sh"

[tasks.run]
description = "Run the reader"
depends = ["build"]
run = '"${CARGO_TARGET_DIR:-target}/release/vpdf" {{arg(name="args", var=true)}}'

[tasks.fmt]
description = "Format source and documentation"
run = ["cargo fmt", "taplo fmt", "rumdl fmt ."]

[tasks."fmt:check"]
run = ["cargo fmt --check", "taplo fmt --check", "rumdl check ."]

[tasks.lint]
description = "Reject performance and complexity regressions"
run = [
  "cargo clippy --locked --all-targets -- -D warnings",
  "sh scripts/width.sh",
]

[tasks.test]
run = "cargo test --locked"

[tasks.check]
depends = ["fmt:check", "lint", "test"]

[tasks.hooks]
run = "prek install"

[tasks.install]
description = "Install the optimized executable"
depends = ["build"]
run = "sh scripts/install.sh"

[tasks.corpus]
description = "Fetch and verify public test PDFs"
run = "sh scripts/corpus.sh"

[tasks."test:corpus"]
depends = ["corpus"]
env.VPDF_CORPUS = "{{env.HOME}}/.cache/vpdf/corpus"
run = "cargo test --locked -- --ignored --skip real_ocr_and_cancel"

[tasks."test:ocr"]
depends = ["corpus"]
env.VPDF_CORPUS = "{{env.HOME}}/.cache/vpdf/corpus"
run = "cargo test --locked --test workers real_ocr_and_cancel -- --ignored"

[tasks.bench]
description = "Measure real-PDF warm frames and search"
depends = ["corpus"]
env.VPDF_CORPUS = "{{env.HOME}}/.cache/vpdf/corpus"
run = "cargo bench --locked --bench reader"

[tasks."bench:latency"]
description = "Measure cold opens, jumps, zooms, and paced scrolling"
depends = ["corpus"]
env.VPDF_CORPUS = "{{env.HOME}}/.cache/vpdf/corpus"
run = "cargo bench --locked --bench latency"

[tasks."bench:stages"]
description = "Attribute cold page cost to load, text, list, raster, encode"
depends = ["corpus"]
env.VPDF_CORPUS = "{{env.HOME}}/.cache/vpdf/corpus"
run = "cargo bench --locked --bench stages"

[tasks."bench:micro"]
description = "Time single hot functions; arguments filter cases"
env.VPDF_CORPUS = "{{env.HOME}}/.cache/vpdf/corpus"
run = 'cargo bench --locked --bench micro -- {{arg(name="cases", var=true, default="")}}'

[tasks."perf:check"]
description = "Enforce warm CPU frame and motion budgets"
depends = ["corpus"]
env.VPDF_CORPUS = "{{env.HOME}}/.cache/vpdf/corpus"
env.VPDF_PERF_CHECK = "1"
run = "cargo bench --locked --bench reader"
