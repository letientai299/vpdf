name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'Test and build' || 'Branch test and build' }} (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            tools: rust rumdl taplo upx
          - os: macos-14
            platform: macos-aarch64
            tools: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools libclang-dev
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: ${{ matrix.tools }}
      - name: Install Rust components
        if: runner.os == 'Linux'
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.platform }}
          cache-workspace-crates: true
      - name: Check formatting
        if: runner.os == 'Linux'
        run: mise run fmt:check
      - name: Lint
        if: runner.os == 'Linux'
        run: mise run lint
      - name: Test
        run: mise run test
      - name: Build and pack executable
        run: mise run release
      - name: Archive executable
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="vpdf-${PLATFORM}.tar.gz"
          tar -czf "target/dist/$archive" -C target/dist vpdf
          cd target/dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vpdf-${{ matrix.platform }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
          compression-level: 0
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish binaries
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    env:
      RELEASE_TAG: main
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: vpdf-*
          merge-multiple: true
          path: dist
      - name: Verify archives
        working-directory: dist
        run: |
          for platform in linux-x86_64 macos-aarch64; do
            sha256sum --check "vpdf-${platform}.tar.gz.sha256"
            tar -tzf "vpdf-${platform}.tar.gz" | grep -Fx vpdf
          done
      - name: Publish rolling release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo 'Skipping superseded branch build'
            exit 0
          fi
          printf 'Rolling %s build: %s\n' "$RELEASE_TAG" "$GITHUB_SHA" > notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file notes.md \
              --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file notes.md --prerelease --latest=false
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  install:
    name: Mise install (${{ matrix.os }})
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: false
      - name: Install published binary
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          MISE_DATA_DIR: ${{ runner.temp }}/mise-install/data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-install/cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-install/config
          MISE_STATE_DIR: ${{ runner.temp }}/mise-install/state
          MISE_USE_VERSIONS_HOST: 'false'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tool="github:$GITHUB_REPOSITORY@$RELEASE_TAG"
          mise i "$tool"
          mise exec "$tool" -- vpdf --version
          mise i --force "$tool"
          mise exec "$tool" -- vpdf --version
