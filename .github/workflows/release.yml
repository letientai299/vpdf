name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish stable binaries
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -B -m tools.package.stable "$RELEASE_TAG"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: vpdf-*
          merge-multiple: true
          path: dist
      - name: Verify archives
        working-directory: dist
        run: |
          for platform in linux-x86_64 macos-aarch64; do
            sha256sum --check "vpdf-${platform}.tar.gz.sha256"
            test "$(tar -tzf "vpdf-${platform}.tar.gz")" = vpdf
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B -m tools.package.publication "$RELEASE_TAG" dist
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$draft" = true ]; then
              gh release upload "$RELEASE_TAG" dist/* --clobber
              gh release edit "$RELEASE_TAG" --draft=false --latest \
                --notes-file "changelogs/$RELEASE_TAG.md"
            else
              mkdir existing
              gh release download "$RELEASE_TAG" --dir existing
              python3 -B -m tools.package.publication "$RELEASE_TAG" existing --verify
            fi
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "Vpdf $RELEASE_TAG" \
              --notes-file "changelogs/$RELEASE_TAG.md"
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  install:
    name: Mise install (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: false
      - name: Install published binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MISE_DATA_DIR: ${{ runner.temp }}/mise-install/data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-install/cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-install/config
          MISE_STATE_DIR: ${{ runner.temp }}/mise-install/state
          MISE_USE_VERSIONS_HOST: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise install python
          tool="github:$GITHUB_REPOSITORY@${RELEASE_TAG#v}"
          mise i "$tool"
          mise exec "$tool" -- vpdf --version > actual.txt
          mise exec python -- python3 -c 'import sys; from pathlib import Path; from tools.package.stable import verify_version; verify_version(Path.cwd(), sys.argv[1], Path("actual.txt").read_text())' "$RELEASE_TAG"
          mise i --force "$tool"
          mise exec "$tool" -- vpdf -V > reinstalled.txt
          cmp actual.txt reinstalled.txt

  tap:
    name: Update Homebrew tap
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: letientai299/homebrew-tap
          ref: main
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Update stable formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/update-vpdf.py "$RELEASE_TAG"
      - name: Publish formula
        run: |
          if git diff --quiet -- Formula/vpdf.rb; then
            echo 'Tap already has this release'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Formula/vpdf.rb
            git commit -m 'chore: update vpdf release'
            git push origin HEAD:main
          fi
