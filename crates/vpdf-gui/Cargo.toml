[package]
name = "vpdf-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lints]
workspace = true

[features]
bench-events = ["vpdf/bench-events", "vpdf-macos/bench-events"]

[dependencies]
vpdf = { path = "../.." }
vpdf-model.workspace = true
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "clipboard",
  "wgpu",
  "wayland",
  "x11",
] }
unicode-width.workspace = true
serde_json.workspace = true

clap.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
vpdf-macos = { path = "../vpdf-macos" }
fmv-macos-events = "0.1"
font-kit.workspace = true
winit = { version = "0.30", default-features = false }

[dev-dependencies]
anyhow.workspace = true
pollster = "1"

[[bench]]
name = "micro"
harness = false
