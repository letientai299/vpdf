[package]
name = "vpdf-pdf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

build = "build.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
mupdf.workspace = true
vpdf-model.workspace = true
vpdf-search.workspace = true
sha2.workspace = true
serde_json.workspace = true
flate2.workspace = true
rustix.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
font-kit.workspace = true
flate2 = { workspace = true, features = ["zlib"] }
mupdf = { workspace = true, features = ["sys-lib-zlib"] }

[[bench]]
name = "micro"
harness = false
