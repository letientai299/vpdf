[tools]
rust = { version = "nightly-2026-10-20", components = "clippy,rustfmt,rust-analyzer,rust-src" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
prek = "0.5.6"
rumdl = "0.3.0"
taplo = "0.10.0"
upx = { version = "5.2.1", os = ["linux"] }

[env]
# Lets check and build share MuPDF.
CARGO_BUILD_TARGET = "{{ arch(x64='x86_64', arm64='aarch64') }}-{{ os(macos='apple-darwin', linux='unknown-linux-gnu') }}"
# Corpus tests and benches; `corpus:huge` fills tmp/huge for ad hoc runs.
VPDF_CORPUS = "{{config_root}}/tmp/corpus"
# Tests and benches start cold and leave the user's search cache alone.
VPDF_CACHE = "off"

[tasks.build]
description = "Build the optimized reader"
run = "sh scripts/build.sh"

[tasks."build:app"]
description = "Build the macOS app and DMG"
run = "sh scripts/build-app.sh"

[tasks."build:icon"]
description = "Render the Vpdf app icon from SVG"
run = "sh scripts/build-icon.sh"

[tasks."install:app"]
description = "Install the macOS app into ~/Applications"
depends = ["build:app"]
run = "sh scripts/install-app.sh"

[tasks."test:app"]
description = "Verify macOS packaging and installation"
depends = ["build:app"]
run = "python3 -B -m unittest discover -s scripts -p test_app.py"

[tasks.release]
description = "Package the release executable with UPX on Linux"
depends = ["build"]
run = "sh scripts/release.sh"

[tasks.try]
description = "Build and run the debug reader"
raw = true
raw_args = true
run = "cargo run --locked -p vpdf --"

[tasks."try:gui"]
description = "Build and run the native reader"
raw = true
raw_args = true
run = "cargo run --locked -p vpdf-gui --"

[tasks.check]
description = "Check every workspace target"
depends = ["check:packages"]
run = "cargo check --locked --workspace --all-targets"

[tasks.lint]
description = "Fix what tools can, then reject the remaining lint and format issues"
depends = ["check:packages"]
run = [
  "cargo clippy --locked --workspace --all-targets --fix --allow-dirty --allow-staged",
  "cargo fmt --all",
  "taplo fmt",
  "rumdl check --fix .",
  "cargo clippy --locked --workspace --all-targets -- -D warnings",
  "sh scripts/width.sh",
]

[tasks.test]
depends = ["test:demo", "test:startup", "test:packages", "check:packages"]
run = "cargo nextest run --locked --workspace --test-threads num-cpus --no-fail-fast"

[tasks."check:packages"]
description = "Check workspace dependencies and native isolation"
run = "python3 -B scripts/check_packages.py"

[tasks."test:packages"]
description = "Test package boundary enforcement"
run = "python3 -B -m unittest discover -s scripts -p test_packages.py"

[tasks.hooks]
run = "prek install"

[tasks.install]
description = "Install the optimized executable"
depends = ["build"]
run = "sh scripts/install.sh"

[tasks.corpus]
description = "Fetch and verify the public test PDFs into tmp/corpus"
run = "sh scripts/corpus.sh corpus"

[tasks.demo]
description = "Capture and optimize the QHD screenshot gallery"
depends = ["build"]
raw_args = true
run = 'python3 scripts/demo.py --binary "${CARGO_TARGET_DIR:-target}/release/vpdf" --build-profile release'

[tasks."test:demo"]
description = "Check screenshot provenance and publication failures"
run = "python3 -B -m unittest discover -s scripts -p test_demo.py"

[tasks."test:startup"]
description = "Check startup trace compatibility"
run = "python3 -B -m unittest discover -s scripts -p test_startup.py"

[tasks."corpus:huge"]
description = "Fetch large stress PDFs into tmp/huge for ad hoc runs"
run = "sh scripts/corpus.sh huge"

[tasks."test:corpus"]
depends = ["corpus"]
run = "cargo nextest run --locked --workspace --run-ignored only -E 'not (test(real_ocr_and_cancel) | test(real_ocr_cache_policy))'"

[tasks."test:ocr"]
depends = ["corpus"]
run = "cargo nextest run --locked --workspace --run-ignored only -E 'test(real_ocr_and_cancel) | test(real_ocr_cache_policy)'"

[tasks.bench]
description = "Measure real-PDF warm frames and search"
depends = ["corpus"]
run = "cargo bench --locked -p vpdf --profile release --bench reader"

[tasks."bench:latency"]
description = "Measure opens, jumps, zooms, searches, and paced scrolling"
depends = ["corpus"]
run = "cargo bench --locked -p vpdf --profile release --bench latency"

[tasks."bench:stages"]
description = "Attribute cold page cost to load, text, list, raster, encode"
depends = ["corpus"]
run = "cargo bench --locked -p vpdf --profile release --bench stages"

[tasks."bench:micro"]
description = "Time single hot functions; arguments filter cases"
run = 'sh scripts/bench-micro.sh {{arg(name="cases", var=true, default="")}}'

[tasks."bench:startup"]
description = "Time launch to complete first view in this terminal"
depends = ["corpus"]
raw = true
run = "python3 scripts/startup.py"

[tasks."bench:budget"]
description = "Enforce warm CPU frame and motion budgets"
depends = ["corpus"]
env.VPDF_PERF_CHECK = "1"
run = "cargo bench --locked -p vpdf --profile release --bench reader"

[tasks."test:model"]
description = "Test shared values without native code"
run = "cargo nextest run --locked -p vpdf-model"

[tasks."test:search"]
description = "Test search without native code or UI"
run = "cargo nextest run --locked -p vpdf-search"

[tasks."test:pdf"]
description = "Test native PDF helpers without the reader"
run = "cargo nextest run --locked -p vpdf-pdf"

[tasks."test:reader"]
description = "Test reading motions and selections without native code or UI"
run = "cargo nextest run --locked -p vpdf-reader"

[tasks."test:protocol"]
description = "Test terminal input decoding without native code or UI"
run = "cargo nextest run --locked -p vpdf-protocol"

[tasks."test:terminal"]
description = "Test terminal delivery without native PDF code"
run = "cargo nextest run --locked -p vpdf-terminal"

[tasks."bench:fixtures"]
description = "Prepare verified native-free render fixtures"
depends = ["corpus"]
run = 'cargo run --locked --release --example bench-fixtures -- "$VPDF_CORPUS/paper.pdf" "${VPDF_BENCH_FIXTURES:-target/bench-fixtures}"'

[tasks."bench:terminal"]
description = "Measure headless terminal delivery using prepared fixtures"
run = 'cargo bench --locked --profile release -p vpdf-terminal --bench micro -- {{arg(name="cases", var=true, default="")}}'

[tasks."test:ui"]
description = "Test interface components without native PDF code"
run = "cargo nextest run --locked -p vpdf-ui"

[tasks."bench:ui"]
description = "Measure interface components using prepared fixtures"
run = 'cargo bench --locked --profile release -p vpdf-ui --bench micro -- {{arg(name="cases", var=true, default="")}}'

[tasks."bench:manuals"]
description = "Measure verified manuals; arguments filter cases"
run = 'cargo bench --locked --profile release -p vpdf --bench manuals -- {{arg(name="cases", var=true, default="")}}'
