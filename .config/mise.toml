[tools]
rust = { version = "nightly-2026-10-17", components = "clippy,rustfmt,rust-analyzer,rust-src" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
prek = "0.5.5"
rumdl = "0.2.79"
taplo = "0.10.0"
upx = { version = "5.2.1", os = ["linux"] }

[env]
# Lets check and build share MuPDF.
CARGO_BUILD_TARGET = "{{ arch(x64='x86_64', arm64='aarch64') }}-{{ os(macos='apple-darwin', linux='unknown-linux-gnu') }}"
# Corpus tests and benches; `corpus:huge` fills tmp/huge for ad hoc runs.
VPDF_CORPUS = "{{config_root}}/tmp/corpus"
# Tests and benches start cold and leave the user's search cache alone.
VPDF_CACHE = "off"

[tasks.build]
description = "Build the optimized reader"
run = "sh scripts/build.sh"

[tasks.release]
description = "Package the release executable with UPX on Linux"
depends = ["build"]
run = "sh scripts/release.sh"

[tasks.run]
description = "Run the reader"
depends = ["build"]
run = '"${CARGO_TARGET_DIR:-target}/release/vpdf" {{arg(name="args", var=true)}}'

[tasks.lint]
description = "Fix what tools can, then reject the remaining lint and format issues"
run = [
  "cargo clippy --locked --all-targets --fix --allow-dirty --allow-staged",
  "cargo fmt",
  "taplo fmt",
  "rumdl check --fix .",
  "cargo clippy --locked --all-targets -- -D warnings",
  "sh scripts/width.sh",
]

[tasks.test]
depends = ["test:demo"]
run = "cargo nextest run --locked --test-threads num-cpus --no-fail-fast"

[tasks.hooks]
run = "prek install"

[tasks.install]
description = "Install the optimized executable"
depends = ["build"]
run = "sh scripts/install.sh"

[tasks.corpus]
description = "Fetch and verify the public test PDFs into tmp/corpus"
run = "sh scripts/corpus.sh corpus"

[tasks.demo]
description = "Capture and optimize the QHD screenshot gallery"
depends = ["build"]
raw_args = true
run = 'python3 scripts/demo.py --binary "${CARGO_TARGET_DIR:-target}/release/vpdf" --build-profile release'

[tasks."test:demo"]
description = "Check screenshot provenance and publication failures"
run = "python3 -B -m unittest discover -s scripts -p test_demo.py"

[tasks."corpus:huge"]
description = "Fetch large stress PDFs into tmp/huge for ad hoc runs"
run = "sh scripts/corpus.sh huge"

[tasks."test:corpus"]
depends = ["corpus"]
run = "cargo nextest run --locked --run-ignored only -E 'not test(real_ocr_and_cancel)'"

[tasks."test:ocr"]
depends = ["corpus"]
run = "cargo nextest run --locked --run-ignored only --test it real_ocr_and_cancel"

[tasks.bench]
description = "Measure real-PDF warm frames and search"
depends = ["corpus"]
run = "cargo bench --locked --profile release --bench reader"

[tasks."bench:latency"]
description = "Measure opens, jumps, zooms, searches, and paced scrolling"
depends = ["corpus"]
run = "cargo bench --locked --profile release --bench latency"

[tasks."bench:stages"]
description = "Attribute cold page cost to load, text, list, raster, encode"
depends = ["corpus"]
run = "cargo bench --locked --profile release --bench stages"

[tasks."bench:micro"]
description = "Time single hot functions; arguments filter cases"
run = 'cargo bench --locked --profile release --bench micro -- {{arg(name="cases", var=true, default="")}}'

[tasks."bench:startup"]
description = "Time launch to complete first view in this terminal"
depends = ["corpus"]
raw = true
run = "python3 scripts/startup.py"

[tasks."bench:budget"]
description = "Enforce warm CPU frame and motion budgets"
depends = ["corpus"]
env.VPDF_PERF_CHECK = "1"
run = "cargo bench --locked --profile release --bench reader"
