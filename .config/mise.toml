[tools]
python = "3.15.2"
rust = { version = "nightly-2026-10-20", components = "clippy,rustfmt,rust-analyzer,rust-src" }
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
prek = "0.5.6"
ruff = "0.17.1"
rumdl = "0.3.0"
taplo = "0.10.0"
typst = "0.15.1"
"aqua:jgm/pandoc" = "3.13"
"github:qpdf/qpdf" = { version = "12.4.2", matching = "-bin-" }
upx = { version = "5.2.1", os = ["linux"] }

[vars]
ocr_tests = "test(real_ocr_and_cancel) | test(real_ocr_cache_policy)"

[env]
_.path = ["{{config_root}}/tools/shims"]
# Lets check and build share MuPDF.
CARGO_BUILD_TARGET = "{{ arch(x64='x86_64', arm64='aarch64') }}-{{ os(macos='apple-darwin', linux='unknown-linux-gnu') }}"
# Corpus tests and benches; `corpus:huge` fills tmp/huge for ad hoc runs.
VPDF_CORPUS = "{{config_root}}/tmp/corpus"

[tasks.validate]
description = "Validate one snapshot and build the debug reader"
env.VPDF_CACHE = "off"
run = "python3 -B -m tools.build.worker validate"

[tasks."ci:check"]
description = "Run current-platform CI checks and verify release archives"
env.CARGO_PROFILE_DEV_OPT_LEVEL = "1"
env.CARGO_INCREMENTAL = "0"
env.VPDF_BENCH_EVENTS = "0"
env.VPDF_CACHE = "off"
env.NEXTEST_RETRIES = "0"
run = "python3 -B -m tools.build.worker ci:check"

[tasks."_ci:check"]
hide = true
run = "python3 -B -m tools.check.ci"

[tasks._validate]
hide = true
run = "python3 -B -m tools.check.hooks validate"

[tasks."build:gui"]
description = "Build the debug native reader"
run = "python3 -B -m tools.build.worker build:gui"

[tasks."_build:gui"]
hide = true
depends = ["help:build"]
run = "cargo build --locked -p vpdf-gui"

[tasks."build:debug"]
description = "Build the debug reader"
run = "python3 -B -m tools.build.worker build:debug"

[tasks."_build:debug"]
hide = true
depends = ["help:build"]
run = "cargo build --locked -p vpdf"

[tasks."build"]
description = "Build the optimized reader"
run = "python3 -B -m tools.build.worker build"

[tasks."_build"]
hide = true
run = "sh tools/build/build.sh"

[tasks."build:app"]
description = "Build the macOS app and DMG"
run = "python3 -B -m tools.build.worker build:app"

[tasks."_build:app"]
hide = true
run = "sh tools/package/app.sh"

[tasks."build:icon"]
description = "Render the Vpdf app icon from SVG"
run = "sh tools/package/icon.sh"

[tasks."install:app"]
description = "Install the macOS app into ~/Applications"
env.VPDF_APP_DMG = "0"
run = [
  "python3 -B -m tools.build.worker build:app",
  "sh tools/package/install-app.sh",
]

[tasks."install:cli"]
description = "Install the optimized terminal reader"
depends = ["build"]
run = "sh tools/package/install.sh"

[tasks."test:app"]
env.VPDF_CACHE = "off"
description = "Verify macOS packaging and installation"
depends = ["build:app"]
run = "python3 -B -m unittest discover -s tools/package -t . -p test_app.py"

[tasks."test:app:open"]
description = "Check Finder document events in a background app"
depends = ["build:app"]
env.VPDF_TEST_OPEN = "1"
run = [
  "sh tools/corpus/corpus.sh corpus paper",
  "python3 -B -m unittest discover -s tools/package -t . -p test_app.py -k DocumentTests",
]

[tasks.release]
description = "Package the release executable with UPX on Linux"
run = "python3 -B -m tools.build.worker release"

[tasks."_release"]
hide = true
depends = ["build"]
run = "sh tools/package/release.sh"

[tasks.try]
depends = ["build:debug"]
description = "Build and run the debug reader"
raw = true
raw_args = true
run = '"${CARGO_TARGET_DIR:-target}/debug/vpdf"'

[tasks."try:gui"]
depends = ["build:gui"]
description = "Build and run the native reader"
raw = true
raw_args = true
run = '"${CARGO_TARGET_DIR:-target}/debug/vpdf-gui"'

[tasks."check"]
description = "Check every workspace target"
run = "python3 -B -m tools.build.worker check"

[tasks."_check"]
hide = true
depends = ["check:packages", "help:build"]
run = "cargo check --locked --workspace --all-targets"

[tasks."help:build"]
description = "Generate the embedded help PDF and topic manifest"
run = "python3 -B -m tools.build.worker help:build"

[tasks."_help:build"]
hide = true
run = "python3 -B -m tools.help.assets"

[tasks."help:check"]
description = "Reject missing, stale, or corrupt help assets"
run = "python3 -B -m tools.build.worker help:check"

[tasks."_help:check"]
hide = true
run = "python3 -B -m tools.help.assets --check"

[tasks."test:help"]
description = "Check help generation and embedded PDF destinations"
run = "python3 -B -m tools.build.worker test:help"

[tasks."_test:help"]
hide = true
depends = ["help:build"]
run = [
  "python3 -B -m tools.help.licenses --check",
  "python3 -B -m unittest discover -s tools/help -t . -p test_assets.py",
  "python3 -B -m tools.help.assets --check --verify-pdf",
  "cargo nextest run --locked -p vpdf -p vpdf-pdf -E 'test(manual::)'",
]

[tasks.lint]
description = "Fix what tools can, then reject the remaining lint and format issues"
depends = ["check:packages", "lint:python"]
run = [
  "cargo fmt --all",
  "taplo fmt",
  "rumdl check --fix .",
  "mise run lint:rust",
  "sh tools/check/width.sh",
]

[tasks."lint:rust"]
hide = true
description = "Check Rust lint without changing source"
run = "python3 -B -m tools.build.worker lint:rust"

[tasks."_lint:rust"]
hide = true
depends = ["help:build"]
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks."lint:python"]
description = "Fix Python lint, imports, and formatting"
run = ["ruff check --fix .", "ruff format .", "ruff check ."]

[tasks."lint:check"]
description = "Check lint without changing files"
run = "python3 -B -m tools.build.worker lint:check"

[tasks."_lint:check"]
hide = true
run = "python3 -B -m tools.check.hooks lint"

[tasks."test"]
description = "Run all standard tests"
run = "python3 -B -m tools.build.worker test"

[tasks."_test"]
hide = true
env.VPDF_CACHE = "off"
depends = [
  "test:demo",
  "test:display",
  "test:startup",
  "test:bench-report",
  "test:build-features",
  "test:build-cache",
  "test:build-worker",
  "test:validation",
  "test:packages",
  "test:hooks",
  "test:ci",
  "test:docs",
  "help:build",
  "test:help-assets",
  "check:packages",
]
run = "cargo nextest run --locked --workspace --test-threads \"${NEXTEST_TEST_THREADS:-4}\" --no-fail-fast"

[tasks."test:docs"]
description = "Check Rust documentation examples"
run = "python3 -B -m tools.build.worker test:docs"

[tasks."_test:docs"]
hide = true
env.VPDF_CACHE = "off"
depends = ["help:build"]
run = "cargo test --locked --workspace --doc"

[tasks."test:events"]
description = "Check feature-gated benchmark input"
run = "python3 -B -m tools.build.worker test:events"

[tasks."_test:events"]
hide = true
depends = ["help:build"]
env.VPDF_CACHE = "off"
run = [
  "cargo clippy --locked --workspace --all-targets --features vpdf-gui/bench-events,vpdf-dev/bench-events -- -D warnings",
  "cargo nextest run --locked -p vpdf -p vpdf-gui --features vpdf-gui/bench-events --no-fail-fast",
]

[tasks."check:packages"]
description = "Check workspace dependencies and native isolation"
run = "python3 -B -m tools.check.packages"

[tasks."test:packages"]
env.VPDF_CACHE = "off"
description = "Test package boundary enforcement"
run = "python3 -B -m unittest discover -s tools/check -t . -p test_packages.py"

[tasks.hooks]
description = "Install staged and pushed snapshot validation"
run = "python3 -B -m tools.check.hooks install"

[tasks."hook:commit"]
env.VPDF_CACHE = "off"
description = "Format staged files and test affected code"
run = "python3 -B -m tools.check.hooks pre-commit"

[tasks."hook:check"]
hide = true
description = "Run full read-only validation"
run = "python3 -B -m tools.build.worker hook:check"

[tasks."_hook:check"]
hide = true
env.VPDF_CACHE = "off"
run = "python3 -B -m tools.check.hooks check"

[tasks."test:ci"]
hide = true
env.VPDF_CACHE = "off"
description = "Test CI failure propagation and release archives"
run = "python3 -B -m unittest discover -s tools/check -t . -p test_ci.py"

[tasks."test:hooks"]
hide = true
env.VPDF_CACHE = "off"
description = "Test hook snapshots and affected-code routing"
run = "python3 -B -m unittest discover -s tools/check -t . -p test_hooks.py"

[tasks.install]
description = "Install the terminal reader and, on macOS, the app"
run = """
python3 -B -m tools.build.worker build:install
sh tools/package/install.sh
if [ "$(uname -s)" = Darwin ]; then sh tools/package/install-app.sh; fi
"""

[tasks."_build:install"]
hide = true
env.VPDF_APP_DMG = "0"
run = """
sh tools/build/build.sh
if [ "$(uname -s)" = Darwin ]; then sh tools/package/app.sh; fi
"""

[tasks.corpus]
description = "Fetch and verify the public test PDFs into tmp/corpus"
run = "sh tools/corpus/corpus.sh corpus"

[tasks.demo]
description = "Capture and optimize the QHD screenshot gallery"
depends = ["build"]
raw_args = true
run = 'python3 -m tools.demo.capture --binary "${CARGO_TARGET_DIR:-target}/release/vpdf" --build-profile release'

[tasks."demo:video"]
description = "Record captioned terminal interaction recipes offline"
run = "python3 -B -m tools.demo.video"

[tasks."demo:publish"]
description = "Plan reviewed demo publication; --apply writes to GitHub"
run = "python3 -B -m tools.demo.media"

[tasks."demo:check"]
description = "Check demo provenance and publication references"
run = "python3 -B -m tools.demo.media --check"

[tasks."test:demo"]
hide = true
env.VPDF_CACHE = "off"
description = "Check screenshot provenance and publication failures"
run = "python3 -B -m unittest discover -s tools/demo -t . -p 'test_*.py'"

[tasks."test:startup"]
hide = true
env.VPDF_CACHE = "off"
description = "Check startup trace compatibility"
run = "python3 -B -m unittest discover -s tools/bench -t . -p test_startup.py"

[tasks."test:build-features"]
hide = true
env.VPDF_CACHE = "off"
description = "Check injection build opt-in"
run = "python3 -B -m unittest discover -s tools/build -t . -p test_features.py"

[tasks."test:build-cache"]
hide = true
description = "Check build cache limits and locking"
run = "python3 -B -m unittest discover -s tools/build -t . -p test_cache.py"

[tasks."test:validation"]
hide = true
description = "Check validation result reuse"
run = "python3 -B -m unittest discover -s tools/build -t . -p test_receipts.py"

[tasks."test:build-worker"]
hide = true
description = "Check shared snapshot reuse and isolation"
run = "python3 -B -m unittest discover -s tools/build -t . -p test_worker.py"

[tasks."corpus:huge"]
description = "Fetch large stress PDFs into tmp/huge for ad hoc runs"
run = "sh tools/corpus/corpus.sh huge"

[tasks."test:corpus"]
description = "Test real PDFs from tmp/corpus, except OCR"
run = "python3 -B -m tools.build.worker test:corpus"

[tasks."_test:corpus"]
hide = true
env.VPDF_CACHE = "off"
depends = ["corpus", "help:build"]
run = "cargo nextest run --locked --workspace --run-ignored only --no-fail-fast -E 'not ({{vars.ocr_tests}})'"

[tasks."test:ocr"]
description = "Test OCR on real PDFs"
run = "python3 -B -m tools.build.worker test:ocr"

[tasks."_test:ocr"]
hide = true
env.VPDF_CACHE = "off"
depends = ["corpus", "help:build"]
run = "cargo nextest run --locked --workspace --run-ignored only -E '{{vars.ocr_tests}}'"

[tasks.bench]
env.VPDF_CACHE = "off"
description = "Measure real-PDF warm frames and search"
depends = ["corpus", "help:build"]
run = "cargo bench --locked -p vpdf-dev --profile release --bench reader"

[tasks."bench:latency"]
env.VPDF_CACHE = "off"
description = "Measure opens, jumps, zooms, searches, and paced scrolling"
depends = ["corpus:huge sdm", "help:build"]
run = "cargo bench --locked -p vpdf-dev --profile release --features bench-events --bench latency"

[tasks."bench:stages"]
env.VPDF_CACHE = "off"
description = "Attribute cold page cost to load, text, list, raster, encode"
depends = ["corpus", "help:build"]
run = "cargo bench --locked -p vpdf-dev --profile release --bench stages"

[tasks."bench:micro"]
depends = ["help:build"]
env.VPDF_CACHE = "off"
description = "Time single hot functions; arguments filter cases"
run = 'sh tools/bench/micro.sh'

[tasks."bench:startup"]
env.VPDF_CACHE = "off"
description = "Time launch to complete first view in this terminal"
depends = ["corpus"]
raw = true
run = "python3 -B -m tools.bench.startup"

[tasks."test:crate"]
description = "Test one workspace package; pass its name and filters"
run = "python3 -B -m tools.build.worker test:crate"

[tasks."_test:crate"]
hide = true
env.VPDF_CACHE = "off"
run = "cargo nextest run --locked -p"

[tasks."bench:fixtures"]
env.VPDF_CACHE = "off"
description = "Prepare verified native-free render fixtures"
depends = ["corpus", "help:build"]
run = 'cargo run --locked --release -p vpdf-dev --bin bench-fixtures -- "$VPDF_CORPUS/paper.pdf" "${VPDF_BENCH_FIXTURES:-target/bench-fixtures}"'

[tasks."bench:manuals"]
depends = ["help:build"]
env.VPDF_CACHE = "off"
description = "Measure verified manuals; arguments filter cases"
run = 'cargo bench --locked --profile release -p vpdf-dev --bench manuals --'

[tasks."bench:drive"]
env.VPDF_CACHE = "off"
description = "Drive headless, native, or Kitty scenarios"
raw_args = true
run = 'python3 -B -m tools.bench.dispatch'

[tasks."bench:headless"]
hide = true
env.VPDF_CACHE = "off"
description = "Drive full-session headless scenarios"
depends = ["corpus:huge sdm", "help:build"]
raw_args = true
run = 'cargo bench --locked --profile release -p vpdf-dev --features bench-events --bench drive --'

[tasks."bench:live"]
hide = true
env.VPDF_CACHE = "off"
description = "Drive native and Kitty scenarios in background windows"
raw_args = true
run = 'python3 -B -m tools.bench.live.drive'

[tasks."bench:report"]
env.VPDF_CACHE = "off"
description = "Summarize marked reader traces"
raw_args = true
run = 'python3 -B -m tools.bench.live.report'

[tasks."test:bench-report"]
hide = true
env.VPDF_CACHE = "off"
run = "python3 -B -m unittest discover -s tools/bench/live -t . -p 'test_*.py'"

[tasks."test:help-assets"]
hide = true
description = "Test help invalidation and atomic publication"
run = [
  "python3 -B -m tools.help.licenses --check",
  "python3 -B -m unittest discover -s tools/help -t . -p test_assets.py",
]

[tasks."test:display"]
description = "Verify macOS display notifications on the main thread"
run = "python3 -B -m tools.build.worker test:display"

[tasks."_test:display"]
hide = true
run = "cargo run --locked -p vpdf-macos --example display-probe"
